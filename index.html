<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПроектоСфера — 3D-выставка</title>
<link rel="stylesheet" href="css/style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script src="data/stands.js?v=4"></script>
</head>
<body data-mode="3d">

<div class="panel top">
  <h1>ПроектоСфера</h1>
  <div class="halls" id="halls" aria-label="Перейти в зал"></div>
  <label>Поиск <input id="q" placeholder="название или команда"></label>
  <label>Направление <select id="f"><option value="">все залы</option></select></label>
  <ul id="results"></ul>
  <a class="btn" href="catalog.html">Режим списка</a>
  <button class="btn" onclick="showStats()">Статистика</button>
</div>

<canvas class="panel mini" id="mini" width="200" height="120" aria-label="Миникарта павильона"></canvas>

<div class="panel moves" aria-label="Перемещение">
  <button data-m="left" aria-label="Повернуть налево">⟲</button>
  <button data-m="fwd" aria-label="Вперёд">▲</button>
  <button data-m="back" aria-label="Назад">▼</button>
  <button data-m="right" aria-label="Повернуть направо">⟳</button>
</div>
<div class="panel help">WASD/стрелки — ходить, мышь с зажатой кнопкой — смотреть, клик по стенду — открыть. На телефоне — кнопки внизу и свайп.<br><a href="privacy.html">Правила и конфиденциальность</a></div>

<div id="modal" hidden></div>

<a-scene renderer="antialias: true" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .stand">
  <a-sky color="#dfeef5"></a-sky>
  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; intensity: 0.6" position="2 6 3"></a-entity>
  <a-entity id="world"></a-entity>
  <a-entity id="rig" position="0 0 6">
    <a-entity id="cam" camera look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 45" position="0 1.6 0"></a-entity>
  </a-entity>
</a-scene>

<script src="js/common.js?v=3"></script>
<script>
// Геометрия павильона: залы стоят в ряд по оси X, стенды — по периметру зала.
const HALL_W = 14, HALL_D = 12, GAP = 2;
const hallX = i => i * (HALL_W + GAP);
const world = document.getElementById("world");
const cam = document.getElementById("cam");
const pos = {};                                  // id стенда -> {x, z, ry}

function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || world).appendChild(e); return e;
}

// Постер стенда рисуем на canvas — картинки не нужны.
function poster(s) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 640;
  const g = c.getContext("2d");
  g.fillStyle = s.color; g.fillRect(0, 0, 512, 640);
  g.fillStyle = "#fff"; g.font = "bold 44px Segoe UI, Arial";
  const words = s.title.split(" "); let line = "", y = 120;
  for (const w of words) {
    if (g.measureText(line + w).width > 440) { g.fillText(line, 36, y); line = ""; y += 56; }
    line += w + " ";
  }
  g.fillText(line, 36, y);
  g.font = "30px Segoe UI, Arial"; g.fillText(s.team, 36, 560);
  g.font = "26px Segoe UI, Arial"; g.fillText("нажмите, чтобы открыть", 36, 605);
  return c.toDataURL();
}

HALLS.forEach((h, i) => {
  const x = hallX(i);
  el("a-plane", { position: `${x} 0 0`, rotation: "-90 0 0", width: HALL_W, height: HALL_D, color: i % 2 ? "#eef3f7" : "#f6f8fa" });
  el("a-box", { position: `${x} 1.5 ${-HALL_D / 2}`, width: HALL_W, height: 3, depth: 0.2, color: "#c9d6df" });
  // шрифт a-text не знает кириллицу, поэтому вывеска зала — тоже картинка на canvas
  const c = document.createElement("canvas"); c.width = 1024; c.height = 128;
  const g = c.getContext("2d"); g.fillStyle = "#1b2a52"; g.fillRect(0, 0, 1024, 128);
  g.fillStyle = "#fff"; g.font = "bold 64px Segoe UI, Arial"; g.textAlign = "center"; g.fillText(h.name, 512, 86);
  el("a-plane", { position: `${x} 3.4 ${-HALL_D / 2 + 0.15}`, width: 8, height: 1, material: { src: c.toDataURL(), shader: "flat" } });
  const list = STANDS.filter(s => s.hall === h.id);
  list.forEach((s, k) => {
    // первые 3 стенда — у задней стены, остальные — по бокам
    let p;
    if (k < 3) p = { x: x - 4 + k * 4, z: -HALL_D / 2 + 0.6, ry: 0 };
    else { const left = k % 2 === 1; p = { x: x + (left ? -HALL_W / 2 + 0.6 : HALL_W / 2 - 0.6), z: -1 + Math.floor((k - 3) / 2) * 3, ry: left ? 90 : -90 }; }
    pos[s.id] = p;
    const st = el("a-entity", { position: `${p.x} 0 ${p.z}`, rotation: `0 ${p.ry} 0` });
    el("a-box", { position: "0 0.4 0", width: 2, height: 0.8, depth: 0.5, color: "#1b2a52" }, st);
    el("a-plane", { class: "stand", "data-id": s.id, position: "0 1.9 0.05", width: 1.6, height: 2, material: { src: poster(s), shader: "flat" } }, st)
      .addEventListener("click", () => openStand(s.id));
  });
});

// Переход к залу / к стенду
function teleport(x, z, ry) {
  document.getElementById("rig").setAttribute("position", `${x} 0 ${z}`);
  cam.setAttribute("position", "0 1.6 0");
  cam.components["look-controls"].yawObject.rotation.y = THREE.MathUtils.degToRad(ry || 0);
  cam.components["look-controls"].pitchObject.rotation.x = 0;
}
const hallsBox = document.getElementById("halls"), f = document.getElementById("f");
HALLS.forEach((h, i) => {
  const b = document.createElement("button"); b.textContent = h.name;
  b.onclick = () => teleport(hallX(i), 4, 0); hallsBox.appendChild(b);
  f.add(new Option(h.name, h.id));
});
function goStand(id) {
  const p = pos[id], r = THREE.MathUtils.degToRad(p.ry);
  teleport(p.x + Math.sin(r) * 2.5, p.z + Math.cos(r) * 2.5, p.ry);
  openStand(id);
}

// Поиск и фильтр
const q = document.getElementById("q"), res = document.getElementById("results");
function renderResults() {
  const t = q.value.trim().toLowerCase(), h = f.value;
  res.innerHTML = "";
  if (!t && !h) return;
  STANDS.filter(s => (!h || s.hall === h) && (!t || (s.title + " " + s.team).toLowerCase().includes(t)))
    .forEach(s => { const li = document.createElement("li"), b = document.createElement("button");
      b.textContent = s.title; b.onclick = () => goStand(s.id); li.appendChild(b); res.appendChild(li); });
}
q.oninput = f.onchange = renderResults;

// Кнопки движения для телефона
document.querySelectorAll(".moves button").forEach(b => b.onclick = () => {
  const rig = document.getElementById("rig").object3D, yaw = cam.components["look-controls"].yawObject;
  const m = b.dataset.m, step = 1.5;
  if (m === "left") yaw.rotation.y += Math.PI / 8;
  else if (m === "right") yaw.rotation.y -= Math.PI / 8;
  else { const d = m === "fwd" ? -step : step;
    rig.position.x += Math.sin(yaw.rotation.y) * d; rig.position.z += Math.cos(yaw.rotation.y) * d; }
});

// Миникарта
const mini = document.getElementById("mini").getContext("2d");
const total = hallX(HALLS.length - 1) + HALL_W, sc = 200 / (total + 2);
function drawMini() {
  mini.clearRect(0, 0, 200, 120);
  const mx = x => (x + HALL_W / 2 + 1) * sc, mz = z => 60 + z * sc * 1.6;
  HALLS.forEach((h, i) => { mini.strokeStyle = "#0e8aa6"; mini.strokeRect(mx(hallX(i) - HALL_W / 2), mz(-HALL_D / 2), HALL_W * sc, HALL_D * sc * 1.6); });
  STANDS.forEach(s => { const p = pos[s.id]; mini.fillStyle = s.color; mini.fillRect(mx(p.x) - 2, mz(p.z) - 2, 4, 4); });
  const w = new THREE.Vector3(); cam.object3D.getWorldPosition(w);
  mini.fillStyle = "#be123c"; mini.beginPath(); mini.arc(mx(w.x), mz(w.z), 4, 0, 7); mini.fill();
  requestAnimationFrame(drawMini);
}
document.querySelector("a-scene").addEventListener("loaded", drawMini);
</script>
</body>
</html>
