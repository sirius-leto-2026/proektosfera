<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация стенда — ПроектоСфера</title>
<meta name="description" content="Демонстрационная презентация стенда выставки «ПроектоСфера»: описание проекта, команда и материалы, которые автор добавит позже.">
<meta name="theme-color" content="#1b2a52">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://sirius-leto-2026.github.io/proektosfera/present.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="ПроектоСфера">
<meta property="og:title" content="Презентация стенда — ПроектоСфера">
<meta property="og:description" content="Демо-презентация стенда выставки: описание проекта, команда и материалы, которые автор добавит позже.">
<meta property="og:url" content="https://sirius-leto-2026.github.io/proektosfera/present.html">
<meta property="og:image" content="https://sirius-leto-2026.github.io/proektosfera/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ПроектоСфера — виртуальная 3D-выставка учебных проектов">
<link rel="stylesheet" href="css/style.css?v=6">
<style>
body{background:#eef3f7;margin:0}
.deck{max-width:980px;margin:0 auto;padding:18px 24px}
.slide{background:#fff;border-radius:14px;min-height:380px;padding:36px 40px;border-top:10px solid var(--c);display:flex;flex-direction:column;justify-content:center}
.slide h1{color:var(--navy);font-size:34px;margin:0 0 12px}
.slide h2{color:var(--navy);font-size:26px;margin:0 0 14px}
.slide p,.slide li{font-size:20px;line-height:1.5}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin-top:10px}
@media (max-width:680px){
  .deck{padding:12px}
  .slide{min-height:300px;padding:22px 18px}
  .slide h1{font-size:26px}
  .slide h2{font-size:21px}
  .slide p,.slide li{font-size:17px}
  .nav .btn{flex:1 1 auto}
}
</style>
</head>
<body data-mode="info">
<main class="deck">
  <div class="slide" id="sl" aria-live="polite"></div>
  <div class="nav" id="nav">
    <button class="btn" id="pv" type="button" aria-label="Предыдущий слайд">← Назад</button>
    <span id="pg" aria-live="polite"></span>
    <button class="btn" id="nx" type="button" aria-label="Следующий слайд">Вперёд →</button>
  </div>
  <p class="note" id="note">Демо-презентация собрана автоматически из карточки стенда. Когда автор загрузит свою презентацию, кнопка на стенде откроет её.</p>
</main>
<script src="data/stands.js?v=6"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const stand = id ? STANDS.find(x => x.id === id) : null;
  const sl = document.getElementById("sl"), pv = document.getElementById("pv"), nx = document.getElementById("nx");
  const pg = document.getElementById("pg"), note = document.getElementById("note"), nav = document.getElementById("nav");

  if (!stand) {
    // Без ?id — не ошибка, а выбор стенда: страницу могут открыть по прямому адресу.
    if (!id) {
      document.title = "Презентации стендов — ПроектоСфера";
      sl.innerHTML = `<h1>Презентации стендов</h1>
        <p>Выберите стенд — покажу демонстрационную презентацию, собранную из его карточки.</p>
        <p>${STANDS.map(s => `<a href="present.html?id=${encodeURIComponent(s.id)}">${s.title}</a>`).join(" · ")}</p>
        <p><a class="btn" href="catalog.html">Каталог стендов</a> <a class="btn" href="index.html">3D-павильон</a></p>`;
      nav.hidden = true;
      return;
    }
    document.title = "Стенд не найден — ПроектоСфера";
    sl.innerHTML = `<h1>Стенд не найден</h1>
      <p>Такого стенда нет на выставке. Откройте карточку из каталога — там все стенды списком.</p>
      <p><a class="btn" href="catalog.html">Каталог стендов</a> <a class="btn" href="index.html">3D-павильон</a></p>`;
    nav.hidden = true;
    note.hidden = true;
    return;
  }

  const hall = (HALLS.find(x => x.id === stand.hall) || {}).name || "";
  document.title = stand.title + " — презентация";
  sl.style.setProperty("--c", stand.color);
  const slides = [
    `<p style="color:${stand.color};font-weight:700;text-transform:uppercase;letter-spacing:.06em">${hall}</p><h1>${stand.title}</h1><p>${stand.team} · ${stand.school}</p>`,
    `<h2>О проекте</h2><p>${stand.text}</p>`,
    `<h2>Что есть на стенде</h2><ul><li>Описание проекта и команда</li><li>Презентация, видео и продукт — по мере загрузки автором</li><li>Кнопка «Нравится» и вопрос автору</li></ul>`,
    `<h2>Спасибо за внимание!</h2><p>Задайте вопрос команде «${stand.team.replace(/^Команда /, "")}» прямо на стенде выставки «ПроектоСфера».</p>`
  ];
  let i = 0;
  let timer = 0;
  const show = () => {
    sl.innerHTML = slides[i];
    pg.textContent = (i + 1) + " / " + slides.length;
    pv.disabled = i === 0;
    nx.disabled = i === slides.length - 1;
  };
  pv.onclick = () => { clearInterval(timer); if (i > 0) { i--; show(); } };
  nx.onclick = () => { clearInterval(timer); if (i < slides.length - 1) { i++; show(); } };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") nx.click();
    if (e.key === "ArrowLeft") pv.click();
  });

  note.innerHTML = `Демо-презентация собрана автоматически из карточки стенда. Когда автор загрузит свою презентацию, кнопка на стенде откроет её.<br><a href="index.html#stand=${encodeURIComponent(stand.id)}">← К стенду на выставке</a> · <a href="catalog.html">Каталог</a> · <a href="privacy.html">Правила</a>`;

  const auto = params.get("auto");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (auto && !reduce) {
    note.insertAdjacentHTML("afterbegin", "<b>Демо-ролик:</b> слайды листаются сами каждые 4 секунды. ");
    timer = setInterval(() => { i = (i + 1) % slides.length; show(); }, 4000);
  } else if (auto && reduce) {
    note.insertAdjacentHTML("afterbegin", "<b>Демо-ролик:</b> автолистание отключено, потому что в системе включено уменьшение движения. ");
  }
  show();
})();
</script>
</body>
</html>
